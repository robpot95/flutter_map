name: flutter_map
description: A versatile mapping package for Flutter, that's simple and easy to learn, yet completely customizable and configurable.
version: 5.1.0

repository: https://github.com/fleaflet/flutter_map
issue_tracker: https://github.com/fleaflet/flutter_map/issues
documentation: https://docs.fleaflet.dev

topics:
  - flutter-map
  - map

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.13.0

dependencies:
  async: ^2.13.1
  collection: ^1.19.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  latlong2: ^0.10.1
  meta: ^1.19.0
  polylabel: ^1.0.1
  proj4dart: ^3.0.0
  vector_math: ^2.4.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - lib/assets/flutter_map_logo.png
